name: build
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test CodexWatchdog.sln --configuration Release --no-restore
      - run: dotnet publish src/CodexWatchdog/CodexWatchdog.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/codex-watchdog-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: codex-watchdog-win-x64
          path: artifacts/codex-watchdog-win-x64/codex-watchdog.exe
